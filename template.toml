name = "memcastle-plugin"
description = "A versioned provider plugin composed from revision-tracked module templates"
strict = true

[questions.plugin_id]
type = "string"
prompt = "Stable plugin ID"
pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"
message = "use lowercase words, numbers and hyphens"

[questions.description]
type = "string"
prompt = "Plugin description"
default = "A MemCastle provider plugin"

[questions.provider]
type = "string"
prompt = "Provider family"
default = "{{ plugin_id }}"

[questions.memcastle]
type = "string"
prompt = "Supported MemCastle versions"
default = ">=0.4, <0.6"

[questions.github_owner]
type = "string"
prompt = "Repository owner"
default = "memcastle"

[questions.repository_name]
type = "string"
prompt = "Repository name"
default = "memcastle-{{ plugin_id }}"

[questions.codecov]
type = "boolean"
prompt = "Upload module test coverage to Codecov?"
default = false

[questions.codecov_project_target]
type = "string"
prompt = "Minimum overall plugin coverage"
default = "80%"
pattern = "^(100|[0-9]{1,2})(\\.[0-9]+)?%$"
message = "use a fixed coverage percentage between 0% and 100%"
when = "{{ codecov }}"
default_when_skipped = true

[questions.codecov_patch_target]
type = "string"
prompt = "Minimum coverage of changed code"
default = "80%"
pattern = "^(100|[0-9]{1,2})(\\.[0-9]+)?%$"
message = "use a fixed coverage percentage between 0% and 100%"
when = "{{ codecov }}"
default_when_skipped = true

[questions.codecov_source_target]
type = "string"
prompt = "Minimum coverage of each reporting source"
default = "80%"
pattern = "^(100|[0-9]{1,2})(\\.[0-9]+)?%$"
message = "use a fixed coverage percentage between 0% and 100%"
when = "{{ codecov }}"
default_when_skipped = true

[questions.codecov_integration_target]
type = "string"
prompt = "Minimum coverage of each reporting integration"
default = "80%"
pattern = "^(100|[0-9]{1,2})(\\.[0-9]+)?%$"
message = "use a fixed coverage percentage between 0% and 100%"
when = "{{ codecov }}"
default_when_skipped = true

[questions.core_versions]
type = "multi_choice"
prompt = "Core releases to validate"
help = "Select main and, when available, plugin-capable minor/major release trees (latest stable patch)"
choices = ["main"]
default = ["main"]

[questions.gh_ship]
type = "boolean"
prompt = "Enable gh-ship release delivery?"
default = false

[questions.ship_token]
type = "choice"
prompt = "gh-ship authentication"
choices = ["app", "pat"]
default = "app"
when = "{{ gh_ship }}"
default_when_skipped = true

[questions.sources]
type = "list"
prompt = "Source module IDs (empty for none)"
default = []
item_pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"
item_message = "use lowercase words, numbers and hyphens for each source ID"

[questions.integrations]
type = "list"
prompt = "Integration module IDs (empty for none)"
default = []
item_pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"
item_message = "use lowercase words, numbers and hyphens for each integration ID"

[computed]
codecov_source_choices = "{{ sources }}"
codecov_integration_choices = "{{ integrations }}"

[questions.codecov_covered_sources]
type = "multi_choice"
prompt = "Source IDs that upload nonempty LCOV reports"
default = []
choices_from = "codecov_source_choices"
when = "{{ codecov }}"

[questions.codecov_covered_integrations]
type = "multi_choice"
prompt = "Integration IDs that upload nonempty LCOV reports"
default = []
choices_from = "codecov_integration_choices"
when = "{{ codecov }}"

# Each rendering records the resolved child-main commits for reviewable provider updates.
[questions.source_template]
type = "string"
prompt = "Source module template repository"
default = "https://github.com/memcastle/memcastle-source.tpl"

[questions.integration_template]
type = "string"
prompt = "Integration module template repository"
default = "https://github.com/memcastle/memcastle-integration.tpl"

[[compose]]
source = "{{ source_template }}"
ref = "main"
from = "sources"
path = "sources"

[[compose]]
source = "{{ integration_template }}"
ref = "main"
from = "integrations"
path = "integrations"
