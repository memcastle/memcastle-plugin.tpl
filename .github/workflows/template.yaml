name: Validate composed plugin template

on: [push, pull_request]

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: memcastle-plugin.tpl
      - uses: actions/checkout@v4
        with:
          repository: memcastle/memcastle-source.tpl
          ref: 5f2a8350bd82c49ec2370d70c83019ff6fc5a822
          path: memcastle-source.tpl
      - uses: actions/checkout@v4
        with:
          repository: memcastle/memcastle-integration.tpl
          ref: d055d87eeba173e56ba0c84bc25c8ddeaeeaa0da
          path: memcastle-integration.tpl
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: memcastle/memcastle@main
        with:
          version: main
      - name: Install the released GitTPL composition contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.14.0 --repo noirbizarre/git-tpl --pattern 'git-tpl_0.14.0_linux-amd64.tar.gz' --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/git-tpl_0.14.0_linux-amd64.tar.gz" -C "$RUNNER_TEMP" ./git-tpl
      - name: Test empty and mixed rendering
        working-directory: memcastle-plugin.tpl
        run: |
          mise exec git-cliff@2.12.0 -- "$RUNNER_TEMP/git-tpl" test
