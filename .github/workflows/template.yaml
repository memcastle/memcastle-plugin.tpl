name: Validate composed plugin template

on: [push, pull_request]

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: memcastle-plugin.tpl
      - uses: actions/checkout@v4
        with:
          repository: memcastle/memcastle-source.tpl
          ref: 5f2a8350bd82c49ec2370d70c83019ff6fc5a822
          path: memcastle-source.tpl
      - uses: actions/checkout@v4
        with:
          repository: memcastle/memcastle-integration.tpl
          ref: d055d87eeba173e56ba0c84bc25c8ddeaeeaa0da
          path: memcastle-integration.tpl
      - uses: actions/checkout@v7
        with:
          repository: memcastle/memcastle-embedding-provider.tpl
          ref: f6a256a1aefe94989661ef9014791482cef792a9
          path: memcastle-embedding-provider.tpl
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: memcastle/memcastle@main
        with:
          version: development
      - uses: noirbizarre/git-tpl@main
        with:
          version: 0.14.3
      - name: Test empty, mixed and embedding rendering
        working-directory: memcastle-plugin.tpl
        run: |
          set -euo pipefail
          result="$(mise exec git-cliff@2.12.0 -- git tpl test --json)"
          jq . <<< "$result"
          jq -e '.summary.failed == 0' <<< "$result" >/dev/null
