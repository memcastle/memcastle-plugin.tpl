[answers]
plugin_id = "pi"
sources = ["pi"]
integrations = ["pi"]
codecov = true
codecov_covered_sources = ["pi"]
source_template = "../memcastle-source.tpl"
integration_template = "../memcastle-integration.tpl"

[expect]
files = ["plugin.toml", "sources/pi/memcastle-source.toml", "integrations/pi/memcastle-integration.toml", "sources/pi/README.md", "integrations/pi/README.md", "integrations/pi/dist/index.js", ".github/workflows/ci.yaml"]
absent = ["manifest.toml", "modules/pi/memcastle-source.toml", "integrations/pi/scripts/check_format.py", ".github/workflows/plugin.yml"]

[expect.contains]
"plugin.toml" = ['type = "source"', 'type = "integration"']
".github/workflows/ci.yaml" = ['source: ["pi"]', 'integration: ["pi"]', 'name: source-pi', 'name: integration-pi']
".github/codecov.yml" = ["source-pi:", "integration-pi:", 'target: "80%"', "informational: true", "carryforward: false"]

[commands]
rendered = ["bash {{ env.TEMPLATE_ROOT }}/tests/scripts/check_package.sh pi"]
