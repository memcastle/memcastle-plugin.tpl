[answers]
plugin_id = "pi"
sources = ["pi"]
integrations = ["pi"]
codecov = true
source_template = "../memcastle-source.tpl"
integration_template = "../memcastle-integration.tpl"

[expect]
files = ["plugin.toml", "modules/pi/memcastle-source.toml", "modules/pi/memcastle-integration.toml", "modules/pi/README.md", "modules/pi/INTEGRATION.md", "modules/pi/dist/index.js", ".github/workflows/ci.yaml"]
absent = ["manifest.toml", "modules/pi/scripts/check_format.py", ".github/workflows/plugin.yml"]

[expect.contains]
"plugin.toml" = ['type = "source"', 'type = "integration"']
".github/workflows/ci.yaml" = ['source: ["pi"]', 'integration: ["pi"]', 'name: source-pi', 'name: integration-pi']

[commands]
rendered = ["bash {{ env.TEMPLATE_ROOT }}/tests/scripts/check_package.sh pi"]
