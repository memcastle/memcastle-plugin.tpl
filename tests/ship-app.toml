git = true

[answers]
plugin_id = "example"
gh_ship = true
codecov = true
ship_token = "app"
sources = []
integrations = []

[expect]
files = ["README.md", "CONTRIBUTING.md", "AGENTS.md", ".github/ship.yml", ".github/workflows/ship.yml", ".github/workflows/prepare-release.yml", ".github/workflows/publish-release.yml", "cliff.toml", "mise.toml", ".github/workflows/ci.yaml", ".github/codecov.yml"]
absent = ["scripts/prepare_release.py", "tests/test_release.py", ".github/workflows/plugin.yml", ".github/workflows/release.yml"]

[expect.contains]
".github/workflows/ship.yml" = ["actions/create-github-app-token@v3", "steps.app-token.outputs.token"]
".github/workflows/prepare-release.yml" = ["dry_run:", "ship-release"]
".github/workflows/publish-release.yml" = ["version: development", "actions/create-github-app-token@v3", "client-id: ${{ vars.APP_CLIENT_ID }}", "private-key: ${{ secrets.APP_PRIVATE_KEY }}", "GH_TOKEN: ${{ steps.app-token.outputs.token }}", "dist/${plugin_id}-${TAG}.tar.gz"]
"cliff.toml" = ['tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"', 'initial_tag = "0.1.0"']
".github/codecov.yml" = ['target: "80%"', "threshold: 0%", 'layout: reach,diff,flags,components,files']
"README.md" = ["Releases use gh-ship and git-cliff", "APP_CLIENT_ID", "## Contributing"]
"CONTRIBUTING.md" = ["Use releasable Conventional Commits", "release/next"]

[expect.lacks]
".github/workflows/publish-release.yml" = ["id-token: write", "GH_TOKEN: ${{ github.token }}", "secrets.SHIP_TOKEN"]
"cliff.toml" = ["example/v"]
".github/codecov.yml" = ["target: auto", "flags:", "component_management:"]

[commands]
rendered = ["bash {{ env.TEMPLATE_ROOT }}/tests/scripts/check_ship.sh example"]
