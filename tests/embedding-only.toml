[answers]
plugin_id = "vector"
embeddings = ["vector-one"]
embedding_template = "../memcastle-embedding-provider.tpl"

[expect]
files = ["plugin.toml", "embeddings/vector-one/Cargo.toml", "embeddings/vector-one/wit/memcastle-embedding.wit", "embeddings/vector-one/memcastle-embedding.toml", ".github/workflows/ci.yaml"]
absent = ["sources/vector-one/memcastle-source.toml", "integrations/vector-one/memcastle-integration.toml"]

[expect.contains]
"README.md" = ["[vector-one](embeddings/vector-one/README.md)", "mise run embedding:vector-one:test"]
"mise.toml" = ['[tasks."embedding:vector-one:test"]', 'dir = "embeddings/vector-one"']
"plugin.toml" = ['type = "embedding_provider"', 'manifest = "embeddings/vector-one/memcastle-embedding.toml"', 'contract = "0.2.0"']
".github/workflows/ci.yaml" = ["name: embedding-vector-one", "path: embeddings/vector-one/", "cargo build --manifest-path", "wasm32-wasip3", 'core: ["development"]', 'python3 embeddings/vector-one/tests/conformance.py --archive "$ARCHIVE" --plugin-id vector --module-id vector-one']

[commands]
rendered = ["bash {{ env.TEMPLATE_ROOT }}/tests/scripts/check_package.sh vector"]

[expect.lacks]
"mise.toml" = ["git-cliff", '[tasks."source:', '[tasks."integration:']
