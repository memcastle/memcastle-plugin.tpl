[answers]
plugin_id = "pi"
sources = ["pi"]
integrations = ["pi"]
codecov = true
codecov_covered_integrations = ["pi"]
source_template = "../memcastle-source.tpl"
integration_template = "../memcastle-integration.tpl"

[expect]
files = ["plugin.toml", "sources/pi/memcastle-source.toml", "sources/pi/README.md", "integrations/pi/memcastle-integration.toml", "integrations/pi/README.md", "integrations/pi/dist/index.js", ".github/workflows/ci.yaml"]
absent = ["manifest.toml", "modules/pi/memcastle-source.toml", "modules/pi/memcastle-integration.toml"]

[expect.contains]
"plugin.toml" = ['type = "source"', 'type = "integration"', 'manifest = "sources/pi/memcastle-source.toml"', 'manifest = "integrations/pi/memcastle-integration.toml"']
".github/codecov.yml" = ["source-pi:", "integration-pi:", 'paths: ["sources/pi/src/**"]', 'paths: ["integrations/pi/src/**"]', "informational: true"]

[commands]
rendered = ["bash {{ env.TEMPLATE_ROOT }}/tests/scripts/check_package.sh pi"]
